[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.22"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
via_ir=true

[invariant]
runs = 256
depth = 50
fail_on_revert = false
shrink_run_limit = 0

[rpc_endpoints]
hydration = "${RPC_HYDRATION}"
lark = "https://2.lark.hydration.cloud"
